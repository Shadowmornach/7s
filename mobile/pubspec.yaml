name: mobile
description: 7s Mobile Client - Flutter Foundation (Stage F0)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  go_router: ^14.6.2
  meta: ^1.15.0
  package_info_plus: ^8.1.2
  logging: ^1.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  google_sign_in: ^6.2.2
  lottie: ^3.1.3
  geolocator: ^13.0.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/picky_rider.json
    - assets/images/hero_illustration.png
    - assets/images/splash_hero_illustration.png
    - assets/images/splash_hero_rider.png
    - assets/images/splash_hero_seamless.png

    - assets/images/welcome_hero_scene.png
    - assets/images/welcome_hero_seamless.png



